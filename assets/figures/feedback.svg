<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc"><title id="title">Feedback deployment with fixed policy bases</title><desc id="desc">Current state and time enter fixed bases. Task coefficients combine their outputs into a control action. The dynamics evolve and return the next state to the policy. Coefficient inference is performed for the task before this feedback loop.</desc><rect width="1000" height="310" rx="14" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#002d72"/></marker></defs><text x="35" y="37" font-family="Arial, sans-serif" font-size="18" fill="#002d72" text-anchor="start" font-weight="600">ONLINE FEEDBACK  ·  basis parameters remain fixed</text><rect x="180" y="125" width="240" height="90" rx="12" fill="#f1f6fc" stroke="#bdcde0"/><text x="300.0" y="159" font-family="Arial, sans-serif" font-size="21" fill="#002d72" text-anchor="middle" font-weight="600">Evaluate fixed bases</text><text x="300.0" y="192" font-family="Arial, sans-serif" font-size="20" fill="#1a1f2b" text-anchor="middle" font-weight="400">φ₁(x,t), …, φₚ(x,t)</text><rect x="500" y="125" width="195" height="90" rx="12" fill="#f1f6fc" stroke="#bdcde0"/><text x="597.5" y="159" font-family="Arial, sans-serif" font-size="21" fill="#002d72" text-anchor="middle" font-weight="600">Combine</text><text x="597.5" y="192" font-family="Arial, sans-serif" font-size="20" fill="#1a1f2b" text-anchor="middle" font-weight="400">u = Σⱼ cⱼ φⱼ</text><rect x="780" y="125" width="185" height="90" rx="12" fill="#f1f6fc" stroke="#bdcde0"/><text x="872.5" y="159" font-family="Arial, sans-serif" font-size="21" fill="#002d72" text-anchor="middle" font-weight="600">Dynamics</text><text x="872.5" y="192" font-family="Arial, sans-serif" font-size="20" fill="#1a1f2b" text-anchor="middle" font-weight="400">ẋ = f(x,u,t)</text><text x="35" y="163" font-family="Arial, sans-serif" font-size="18" fill="#1a1f2b" text-anchor="start" font-weight="400">State + time</text><text x="35" y="191" font-family="Arial, sans-serif" font-size="20" fill="#1a1f2b" text-anchor="start" font-weight="400">x(t), t</text><text x="599" y="79" font-family="Arial, sans-serif" font-size="19" fill="#0b847b" text-anchor="middle" font-weight="400">Task coefficients c(η)</text><path d="M126 170 H180" fill="none" stroke="#002d72" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M420 170 H500" fill="none" stroke="#002d72" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M695 170 H780" fill="none" stroke="#002d72" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M599 90 V125" fill="none" stroke="#002d72" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M872 215 V269 H105 V215 H180" fill="none" stroke="#002d72" stroke-width="2.2" marker-end="url(#arrow)"/><text x="457" y="157" font-family="Arial, sans-serif" font-size="18" fill="#5b6470" text-anchor="middle" font-weight="400">φⱼ</text><text x="737" y="157" font-family="Arial, sans-serif" font-size="18" fill="#5b6470" text-anchor="middle" font-weight="400">u(t)</text><text x="489" y="296" font-family="Arial, sans-serif" font-size="17" fill="#5b6470" text-anchor="middle" font-weight="400">Updated state feeds the next policy evaluation</text></svg>